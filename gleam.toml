name = "tokfit"
version = "0.1.2"
gleam = ">= 1.18.0 and < 2.0.0"
licences = ["Apache-2.0"]
description = "Byte-level BPE token counting and budget trimming for OpenAI's o200k_base encoding, in pure Gleam on both the Erlang and JavaScript runtimes."
repository = { type = "github", user = "HEKPYTO", repo = "TOKFIT" }
links = [{ title = "Source", href = "https://github.com/HEKPYTO/TOKFIT" }]

internal_modules = ["tokfit/internal/*"]

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
argv = ">= 1.0.0 and < 2.0.0"

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
